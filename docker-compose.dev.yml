services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  python:
    build:
      context: ./python
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${PYTHON_PORT:-8002}:8000"
    volumes:
      - ./python:/app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      - ./backend:/app
      - backend_go_cache:/go/pkg/mod
    environment:
      APP_ENV: development
      LOG_LEVEL: debug

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      INTERNAL_API_URL: http://backend:8080
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-TikTokUp}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

volumes:
  backend_go_cache:
  frontend_node_modules:
  frontend_next_cache:
